<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin panel — UrDU 5 muhim tashabbus</title>
  <link rel="icon" href="assets/images/urdu_5t_emblem.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .admin-bar { background: var(--surface); border-bottom: 1px solid var(--border); }
    .admin-bar .container { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 68px; }
    .admin-bar img { height: 46px; }
    .admin-bar nav { display: flex; gap: 8px; align-items: center; }
    .login-box { max-width: 420px; margin: 10vh auto; padding: 32px; }
    .login-box h1 { font-size: 1.4rem; margin-bottom: 6px; }
    .login-error { color: var(--red); font-size: .9rem; min-height: 1.2em; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    .kind-note { margin: 0 0 12px; font-size: .88rem; color: var(--text-3); }
    .rows { display: grid; gap: 10px; }
    .row { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 12px 16px; }
    .row .thumb { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: var(--surface-2, #eef1f7); }
    .row .thumb.none { display: grid; place-items: center; color: var(--text-3); }
    .row strong { display: block; font-size: .98rem; }
    .row small { color: var(--text-3); font-size: .84rem; }
    .row .actions { display: flex; gap: 6px; }
    .row .icon-btn.danger:hover { color: var(--red); border-color: var(--red); }
    .modal-box.wide { max-width: 760px; }
    .img-field { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .img-preview { width: 120px; height: 90px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); }
    .hint { font-size: .8rem; color: var(--text-3); margin-top: 4px; }
    .check { display: flex; gap: 10px; align-items: center; font-weight: 600; }
    .check input { width: 18px; height: 18px; }
    textarea.lines { min-height: 90px; }
    [hidden] { display: none !important; }
    @media (max-width: 600px) { .row { grid-template-columns: 1fr auto; } .row .thumb { display: none; } }
  </style>
</head>
<body data-page="admin">
  <header class="admin-bar">
    <div class="container">
      <a href="index.html"><img src="assets/images/urdu_5t_logo.png" alt="UrDU 5 muhim tashabbus"></a>
      <nav id="admin-nav" hidden>
        <a href="index.html" class="btn btn-outline btn-sm" target="_blank"><i class="fa-solid fa-arrow-up-right-from-square"></i> Saytni ochish</a>
        <button type="button" class="btn btn-outline btn-sm" id="logout"><i class="fa-solid fa-right-from-bracket"></i> Chiqish</button>
      </nav>
    </div>
  </header>

  <main>
    <!-- Kirish -->
    <section id="login-view" hidden>
      <form class="card login-box form" id="login-form">
        <div>
          <h1>Admin panel</h1>
          <p class="form-hint">Sayt ma'lumotlarini boshqarish uchun parolni kiriting.</p>
        </div>
        <div class="field">
          <label for="password">Parol</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <p class="login-error" id="login-error" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-block">Kirish</button>
      </form>
    </section>

    <!-- API yo'q -->
    <section id="offline-view" class="container" hidden>
      <div class="card card-pad" style="margin-top:40px">
        <h1 class="section-title" style="font-size:1.4rem">Server topilmadi</h1>
        <p class="section-lead">Admin panel serverdagi dashboard backend bilan ishlaydi. Saytni <code>backend/server.py</code> orqali ishga tushiring.</p>
      </div>
    </section>

    <!-- Boshqaruv -->
    <section id="admin-view" class="container" hidden>
      <div class="page-title">
        <h1 class="section-title">Boshqaruv</h1>
        <div class="tabs" id="tabs"></div>
      </div>
      <div class="toolbar" style="margin-top:20px">
        <label class="search-input">
          <span class="sr-only">Qidirish</span>
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="search" id="admin-search" placeholder="Qidirish...">
        </label>
        <button type="button" class="btn btn-primary" id="add-btn"><i class="fa-solid fa-plus"></i> <span id="add-label">Qo'shish</span></button>
      </div>
      <p class="kind-note" id="kind-note" hidden></p>
      <div class="rows" id="rows"></div>
    </section>
  </main>

  <!-- Umumiy tahrirlash shakli (maydonlar server sxemasidan quriladi) -->
  <div class="modal" id="edit-modal" role="dialog" aria-modal="true" aria-labelledby="edit-title">
    <div class="modal-box wide">
      <button type="button" class="icon-btn modal-close" aria-label="Yopish"><i class="fa-solid fa-xmark"></i></button>
      <h2 id="edit-title">Tahrirlash</h2>
      <form class="form" id="edit-form" novalidate>
        <div id="edit-fields" class="form"></div>
        <p class="login-error" id="edit-error" role="alert"></p>
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Saqlash</button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
