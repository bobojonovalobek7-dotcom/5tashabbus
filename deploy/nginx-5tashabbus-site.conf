# Umumiy sayt sozlamalari: 80 va 443 server bloklari shu faylni ulaydi.
# Joylashuv: /etc/nginx/snippets/5tashabbus-site.conf

root /var/www/5tashabbus;
index index.html;

client_max_body_size 8m;

gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# Sayt Cloudflare orqali ochiladi: haqiqiy mijoz IP'si faqat Cloudflare
# manzillaridan kelgan CF-Connecting-IP sarlavhasidan olinadi.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Let's Encrypt sertifikatini yangilash uchun
location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
}

# Xizmat fayllari tashqariga berilmaydi
location ~ /\.           { deny all; }
location ^~ /backend/    { deny all; }
location ^~ /deploy/     { deny all; }
location ~ \.(pem|sh|md|example)$ { deny all; }

# Dashboard API
location /api/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Admin paneldan yuklangan rasmlar (^~ — pastdagi .jpg/.png qoidasi bu papkani egallab olmasin)
location ^~ /uploads/ {
    alias /var/lib/urdu5t/uploads/;
    expires 30d;
}

location / {
    try_files $uri $uri/ =404;
}

location ~* \.(jpg|jpeg|png|webp|svg|ico|css|js|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
}

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
