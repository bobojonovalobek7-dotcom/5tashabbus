# Nginx: UrDU 5 tashabbus sayti + dashboard API
# Joylashuv: /etc/nginx/sites-available/5tashabbus  (sites-enabled ga havola)
server {
    listen 80;
    listen [::]:80;
    server_name _;   # domen ulanganda shu yerga yoziladi, masalan: 5tashabbus.urdu.uz

    root /var/www/5tashabbus;
    index index.html;

    client_max_body_size 8m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Xizmat fayllari tashqariga berilmaydi
    location ~ /\.           { deny all; }
    location ^~ /backend/    { deny all; }
    location ^~ /deploy/     { deny all; }
    location ~ \.(pem|sh|md|example)$ { deny all; }

    # Dashboard API
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin paneldan yuklangan rasmlar
    location /uploads/ {
        alias /var/lib/urdu5t/uploads/;
        expires 30d;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(jpg|jpeg|png|webp|svg|ico|css|js|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
