# Nginx: UrDU 5 tashabbus sayti (HTTPS, 443-port)
# Joylashuv: /etc/nginx/sites-available/5tashabbus-ssl
# Faqat Let's Encrypt sertifikati mavjud bo'lsa yoqiladi (deploy.sh tekshiradi).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 5tashabbus.ursu.uz;

    ssl_certificate     /etc/letsencrypt/live/5tashabbus.ursu.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/5tashabbus.ursu.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:urdu5t_ssl:10m;

    include /etc/nginx/snippets/5tashabbus-site.conf;
}
