<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aloqa — UrDU Besh muhim tashabbus</title>
  <meta name="description" content="UrDU Besh muhim tashabbus markazi bilan bog'lanish: manzil, telefonlar, sardorlar va murojaat shakli.">
  <link rel="icon" href="assets/images/urdu_5t_emblem.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/main.css?v=20261124c">
  <script>try{var t=localStorage.getItem("urdu5t-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body data-page="aloqa">
<main>

  <div class="container page-title">
    <h1 class="section-title">Aloqa</h1>
  </div>

  <section class="section">
    <div class="container contact-grid">
      <div class="contact-side">
        <div class="card card-pad">
          <h3 style="font-size:1.15rem;margin-bottom:20px">Markaz</h3>
          <div class="contact-list" id="contact-info"></div>
        </div>
        <div class="card map-card">
          <div class="map-canvas" id="map" role="region" aria-label="Markaz joylashuvi xaritada"></div>
          <div class="map-info">
            <span class="map-kicker"><i class="fa-solid fa-location-dot"></i> Bizning manzil</span>
            <strong id="map-title">Urganch davlat universiteti</strong>
            <p id="map-address"></p>
            <div class="map-actions">
              <a class="btn btn-primary btn-sm" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&amp;destination=41.5563137,60.6065737"><i class="fa-solid fa-diamond-turn-right"></i> Yo'l ko'rsatish</a>
              <a class="btn btn-outline btn-sm" target="_blank" rel="noopener" href="https://yandex.uz/maps/?pt=60.6065737,41.5563137&amp;z=17&amp;l=map"><i class="fa-solid fa-map"></i> Yandex xarita</a>
            </div>
          </div>
        </div>
      </div>

      <div class="grid" style="gap:24px">
        <div class="card card-pad">
          <h3 style="font-size:1.15rem;margin-bottom:6px">Murojaat yuborish</h3>
          <p class="form-hint" style="margin-bottom:20px">Xabaringiz markazga yuboriladi, tez orada javob beramiz.</p>
          <form class="form" id="contact-form">
            <input type="text" name="website" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">
            <div class="form-row">
              <div class="field"><label for="c-name">Ism va familiya</label><input id="c-name" name="name" required autocomplete="name"></div>
              <div class="field"><label for="c-phone">Telefon yoki Telegram</label><input id="c-phone" name="phone" required></div>
            </div>
            <div class="field">
              <label for="c-topic">Mavzu</label>
              <select id="c-topic" name="topic">
                <option>Savol</option>
                <option>Yangi to'garak taklifi</option>
                <option>Tanlov bo'yicha</option>
                <option>Shikoyat yoki taklif</option>
              </select>
            </div>
            <div class="field"><label for="c-msg">Xabar</label><textarea id="c-msg" name="message" required></textarea></div>
            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> Yuborish</button>
          </form>
        </div>
      </div>
    </div>
  </section>

</main>
<script src="js/alifbo.js?v=20261124c"></script>
<script src="js/data.js?v=20261124c"></script>
<script src="js/site.js?v=20261124c"></script>
<script src="js/pages.js?v=20261124c"></script>
<script src="js/credit.js?v=20261124c"></script>
</body>
</html>
